
name: Build AutoSandOrders Fabric

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoSandOrders.java'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Prepare Fabric project
        run: |
          mkdir -p src/main/java/autosand src/main/resources
          cp AutoSandOrders.java src/main/java/autosand/AutoSandOrders.java
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'AutoSandOrders'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version '1.14-SNAPSHOT'
          }
          version = '1.0.0'
          group = 'autosand'
          base {
              archivesName = 'AutoSandOrders'
          }
          repositories {
              mavenCentral()
          }
          dependencies {
              minecraft 'com.mojang:minecraft:1.21.11'
              mappings 'net.fabricmc:yarn:1.21.11+build.1:v2'
              modImplementation 'net.fabricmc:fabric-loader:0.18.1'
              modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11'
          }
          java {
              toolchain.languageVersion = JavaLanguageVersion.of(21)
          }
          EOF
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "autosand",
            "version": "1.0.0",
            "name": "AutoSandOrders",
            "environment": "client",
            "entrypoints": {
              "client": ["autosand.AutoSandOrders"]
            },
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Build JAR
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSandOrders-JAR
          path: build/libs/*.jar
