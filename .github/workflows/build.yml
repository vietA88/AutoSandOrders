
name: Build AutoSandOrders Fabric

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoSandOrders.java'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Prepare Fabric project
        run: |
          mkdir -p src/main/java/autosand src/main/resources
          cp AutoSandOrders.java src/main/java/autosand/AutoSandOrders.java

          sed -i 's/License\.quickCheck()/License.valid()/g' src/main/java/autosand/AutoSandOrders.java

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'AutoSandOrders'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT'
          }

          group = 'autosand'
          version = '1.0.0'

          base {
              archivesName = 'AutoSandOrders'
          }

          dependencies {
              minecraft 'com.mojang:minecraft:1.21.11'
              mappings loom.officialMojangMappings()
              modImplementation 'net.fabricmc:fabric-loader:0.18.1'
              modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11'
          }

          java {
              toolchain.languageVersion = JavaLanguageVersion.of(21)
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "autosand",
            "version": "1.0.0",
            "name": "AutoSandOrders",
            "environment": "client",
            "entrypoints": {
              "client": ["autosand.AutoSandOrders"]
            },
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Build JAR
        run: gradle build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoSandOrders-JAR
          path: build/libs/*.jar
          if-no-files-found: error
