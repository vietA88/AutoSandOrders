          distribution: temurin
          java-version: '21'

      - uses: actions/checkout@v4

      - name: Check source
        run: |
          ls -la
          test -f AutoSandOrders.java

      - name: Build instructions
        run: |
          echo "Java source uploaded. Fabric project configuration is still required."
